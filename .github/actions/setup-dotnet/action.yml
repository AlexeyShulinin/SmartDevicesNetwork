name: "Setup .NET and check project"
description: "Sets up .NET SDK and checks the project for formatting, code analysis, and runs unit tests."

inputs:
  dotnet-version:
    required: true
    default: "10.0.x"
  
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ vars.DOTNET_VERSION }}

    - name: Cache NuGet packages
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    # Even for cache-hit, we still need to restore assets (project.assets.json).
    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build SmartDevicesNetwork.WebApi --no-restore

    - name: Format check
      run: dotnet format --verify-no-changes

    - name: Code analysis
      run: dotnet format analyzers --verify-no-changes

    - name: Unit tests
      run: dotnet test