name: Matrix build

on:
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        versions: [9.0, 10.0]
        include:
          - os: windows-latest
            versions: 8.0
        exclude:
          - os: macos-latest
            versions: 9.0
        
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.versions }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build SmartDevicesNetwork.WebApi

      - name: Unit tests
        run: dotnet test