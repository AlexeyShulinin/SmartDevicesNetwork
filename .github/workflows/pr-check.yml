name: Pull Request Check

on:
  pull_request:
    types: [ opened, synchronize ]
    branches: [ master ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-check-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: AlexeyShulinin/github-actions/.github/workflows/pr-check.yml@master
        with: 
          dotnet-version: ${{ vars.DOTNET_VERSION }}
          project-name: 'SmartDevicesNetwork.Webapi'