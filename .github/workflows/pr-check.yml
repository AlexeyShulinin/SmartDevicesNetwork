name: Pull Request Check v2

on:
  pull_request:
    types: [ opened, synchronize ]
    branches: [ master ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-check-workflow:
    uses: AlexeyShulinin/github-actions/.github/workflows/pr-check.yml@master
    with: 
      dotnet-version: ${{ vars.DOTNET_VERSION }}
      project-name: 'SmartDevicesNetwork.Webapi'