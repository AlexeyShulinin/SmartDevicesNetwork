name: Pull Request Check

on:
  pull_request:
    types: [ opened, synchronize ]
    branches: [ master ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs: 
      build-result: ${{ steps.build.result }}
      format-result: ${{ steps.format.result }}
      analyze-result: ${{ steps.analyze.result }}
      test-result: ${{ steps.test.result }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build SmartDevicesNetwork.WebApi && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Format check
        run: |
          dotnet format --verify-no-changes && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Code analysis
        run: | 
          dotnet format analyzers --verify-no-changes && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Unit tests
        run: |
          dotnet test && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT
  
  create-pr-comment:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Create or update success PR comment
        if: ${{ needs.build.result == 'success' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### CI Status ✔
            
            **Build:** Success 
            **Format:** Success  
            **Analyze:** Success  
            **Tests:** Success  
            
            🟢 All checks passed — ready for merge.
            
      - name: Create or update failure PR comment
        if: ${{ needs.build.result == 'failure' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### CI Status ❌
            
            **Build:** ${{ needs.build.outputs.build-result }}  
            **Format:** ${{ needs.build.outputs.format-result }}  
            **Analyze:** ${{ needs.build.outputs.analyze-result }}  
            **Tests:** ${{ needs.build.outputs.test-result }}  
            
            🔴 Some checks failed — please review the logs and fix the issues.