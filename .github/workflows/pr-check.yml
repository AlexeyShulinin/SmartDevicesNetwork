name: Pull Request Check

on:
  pull_request:
    types: [ opened, synchronize ]
    branches: [ master ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build SmartDevicesNetwork.WebApi

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Code analysis
        run: dotnet format analyzers --verify-no-changes

      - name: Unit tests
        run: dotnet test
  
  create-pr-comment:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Create or update success PR comment
        if: ${{ needs.build.result == 'success' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### CI Status ✔
            
            **Build:** Success 
            **Format:** Success  
            **Analyze:** Success  
            **Tests:** Success  
            
            🟢 All checks passed — ready for merge.
            
      - name: Create or update failure PR comment
        if: ${{ needs.build.result == 'failure' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### CI Status ❌
            
            **Build:** ${{ job.status == 'failure' && 'Failure' || 'Success' }}  
            **Format:** ${{ job.status == 'failure' && 'Failure' || 'Success' }}  
            **Analyze:** ${{ job.status == 'failure' && 'Failure' || 'Success' }}  
            **Tests:** ${{ job.status == 'failure' && 'Failure' || 'Success' }}  
            
            🔴 Some checks failed — please review the logs and fix the issues.