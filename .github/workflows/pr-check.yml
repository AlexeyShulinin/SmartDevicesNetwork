name: Pull Request Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build SmartDevicesNetwork.WebApi

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Code analysis
        run: dotnet format analyzers --verify-no-changes

      - name: Unit tests
        run: dotnet test