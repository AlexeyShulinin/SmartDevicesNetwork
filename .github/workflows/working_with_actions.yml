name: Working with Actions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up dotnet via composite action
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}