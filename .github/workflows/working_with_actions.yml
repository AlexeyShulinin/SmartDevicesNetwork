name: Working with Actions

on:
  workflow_dispatch:
    
env:
  PROJECT_NAME: SmartDevicesNetwork.WebApi
  DOCKER_WEB_API_IMAGE_NAME: smart-devices-network-api
  WEB_API_DOCKER_IMAGE: smart-devices-network-api.tar
  DOCKER_ARTIFACT_NAME: webapi-docker-image

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up dotnet via composite action
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}
          project-name: ${{ env.PROJECT_NAME }}
          
      - name: Save Docker image
        run: |
          docker save ${{ env.DOCKER_WEB_API_IMAGE_NAME }}:latest -o ${{ env.WEB_API_DOCKER_IMAGE }}

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DOCKER_ARTIFACT_NAME }}
          path: ${{ env.WEB_API_DOCKER_IMAGE }}
  
  run-docker:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DOCKER_ARTIFACT_NAME }}
          
      - name: Load Docker image
        run: |
          docker load -i ${{ env.WEB_API_DOCKER_IMAGE }}
          
      - name: Run Docker Image
        run: |
          docker run -p 9010:8080 ${{ env.DOCKER_WEB_API_IMAGE_NAME }}